name: Release Pipeline

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Attach Release Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: make test

      - name: Build macOS Application Bundle
        run: ./scripts/build-app.sh

      - name: Package Release Archive & Checksum
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date +'%Y.%m.%d')"
          fi
          
          ZIP_NAME="WebBlacklist-${TAG}.zip"
          zip -r "$ZIP_NAME" WebBlacklist.app
          shasum -a 256 "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          DMG_NAME="WebBlacklist-${TAG}.dmg"
          ./scripts/build-dmg.sh "$DMG_NAME"
          shasum -a 256 "$DMG_NAME" > "${DMG_NAME}.sha256"
          
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "📦 Created $ZIP_NAME, $DMG_NAME and checksum files"

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Workflow Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: WebBlacklist-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          retention-days: 30
